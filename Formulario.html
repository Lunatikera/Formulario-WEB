<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Películas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
            padding: 20px;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 40px;
            font-weight: 600;
            letter-spacing: -1px;
            font-size: 2.5em;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
            font-size: 0.9em;
            transition: 0.3s;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 2px #6366f1;
        }

        select {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        select option {
            color: black;
            background: white;
        }

        input::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .checkbox-label:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
            accent-color: #6366f1;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin: 15px 0;
        }

        .radio-label {
            display: flex;
            align-items: center;
        }

        input[type="radio"] {
            width: auto;
            margin-right: 8px;
            accent-color: #6366f1;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        @media (max-width: 480px) {
            .glass-container {
                padding: 25px;
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <h1>🎥 Registrar Nueva Película</h1>
        
        <form>
            <div class="form-group">
                <label>Título de la película</label>
                <input type="text" placeholder="Ej: El Padrino" required>
            </div>

            <div class="form-group">
                <label>Fecha de lanzamiento</label>
                <input type="date" required>
            </div>

            <div class="form-group">
                <label>Género</label>
                <select>
                    <option value="">Seleccionar género</option>
                    <option>Ciencia Ficción</option>
                    <option>Drama</option>
                    <option>Acción</option>
                    <option>Comedia</option>
                    <option>Terror</option>
                </select>
            </div>
                  <div class="form-group">
                <label>Plataformas disponibles</label>
                <div class="checkbox-grid">
                    <label class="checkbox-label">
                        <input type="checkbox"> Netflix
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox"> Amazon
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox"> Disney+
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox"> HBO Max
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Clasificación</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="rating"> A
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="rating"> +12
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="rating"> +16
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="rating"> +18
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Sinopsis</label>
                <textarea rows="4" placeholder="Escribe la sinopsis..."></textarea>
            </div>

            <button type="submit">Guardar Película</button>
        </form>
    </div>
</body>
</html>
